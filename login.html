<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tela-Login</title>
    <link rel="stylesheet" href="estilos/style.css" >
    <link rel="stylesheet" href="estilos/media-query.css">
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined" rel="stylesheet" />
</head>
<body>
    <main>
        <section id="login">
            <div id="imagem"> </div>

            <div id="formulario">
                <h1>Login</h1> 
                <p>Seja bem-vindo(a) novamente. Faça login para acessar sua conta e poder fazer as configurações no seu ambiente. </p>
                <form id="formLogin" autocomplete="on">
                    <div class="campo"> 
                        <span class="material-symbols-outlined">person</span>
                        <input type="email" name="login" id="ilogin" placeholder="Seu e-mail" autocomplete="email" required maxlength="30">
                        <label for="ilogin">Login</label> </div>
                    <div class="campo">
                    <span class="material-symbols-outlined">key</span>
                        <input type="password" name="senha" id="isenha" placeholder="Sua senha" autocomplete="current-password" required minlength="8" maxlength="20" >
                        <label for="isenha">Senha</label>
                    </div>
                    <input type="submit" value="Entrar">
                    <a href="esqueci.html" class="botao">
                        Esqueci a senha <span class="material-symbols-outlined">mail</span> </a>
                        
                       <p class="cadastro">
                    Não tem uma conta? <a href="cadastro.html">Cadastre-se</a>
                                </p> 
                        

                </form>
            </div>

        </section>
    </main> 

    <script>
        const formulario = document.getElementById("formLogin");

        formulario.addEventListener("submit", async function(event) {
            event.preventDefault();

            const email = document.getElementById("ilogin").value;
            const senha = document.getElementById("isenha").value;

            try {
                const resposta = await fetch("http://127.0.0.1:8000/login", {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/json"
                    },
                    body: JSON.stringify({
                        email: email,
                        senha: senha
                    })
                });

                const dados = await resposta.json();

                if (resposta.ok) {
                    alert("Login realizado com sucesso!");
                } else {
                    alert("Erro: " + (dados.detail || "E-mail ou senha inválidos."));
                }

            } catch (erro) {
                alert("Não foi possível conectar com a API.");
                console.error(erro);
            }
        });
    </script>


</body>
</html>
