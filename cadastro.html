<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tela-Cadastro</title>
    <link rel="stylesheet" href="estilos/style.css">
    <link rel="stylesheet" href="estilos/media-query.css">
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined" rel="stylesheet">
</head>

<body>
    <main>
        <section id="cadastro">
            <div id="imagem"></div>

            <div id="formulario-cadastro">
                <h1>Cadastro</h1>

                <p>Crie sua conta no Reparaê para encontrar ou oferecer serviços.</p>

                <form id="formCadastro" autocomplete="on">

                    <div class="campo">
                        <span class="material-symbols-outlined">person</span>
                        <input type="text" name="nome" id="inome"
                            placeholder="Seu nome"
                            autocomplete="name"
                            required
                            maxlength="50">
                        <label for="inome">Nome</label>
                    </div>

                    <div class="campo">
                        <span class="material-symbols-outlined">mail</span>
                        <input type="email" name="email" id="iemail"
                            placeholder="Seu e-mail"
                            autocomplete="email"
                            required
                            maxlength="50">
                        <label for="iemail">E-mail</label>
                    </div>

                    <div class="campo">
                        <span class="material-symbols-outlined">key</span>
                        <input type="password" name="senha" id="isenha"
                            placeholder="Sua senha"
                            autocomplete="new-password"
                            required
                            minlength="8"
                            maxlength="20">
                        <label for="isenha">Senha</label>
                    </div>

                    <div class="campo">
                        <span class="material-symbols-outlined">group</span>
                        <select name="tipo" id="itipo" required>
                            <option value="" disabled selected>Tipo de usuário</option>
                            <option value="cliente">Cliente</option>
                            <option value="profissional">Profissional</option>
                        </select>
                        <label for="itipo">Tipo de usuário</label>
                    </div>

                    <input type="submit" value="Cadastrar">

                    <p class="cadastro">
                        Já tem uma conta? <a href="index.html">Entrar</a>
                    </p>

                </form>
            </div>
        </section>
    </main>
    <script>
    const formulario = document.getElementById("formCadastro");

    formulario.addEventListener("submit", async function(event) {
        event.preventDefault();

        const nome = document.getElementById("inome").value;
        const email = document.getElementById("iemail").value;
        const senha = document.getElementById("isenha").value;
        const tipo = document.getElementById("itipo").value;

        try {
            const resposta = await fetch("https://ativprogramareparae.onrender.com/usuarios", {
                method: "POST",
                headers: {
                    "Content-Type": "application/json"
                },
                body: JSON.stringify({
                    nome: nome,
                    email: email,
                    senha: senha,
                    tipo: tipo
                })
            });

            const dados = await resposta.json();

            if (resposta.ok) {
                alert("Cadastro realizado com sucesso!");
                formulario.reset();
            } else {
                alert("Erro: " + (dados.detail || "Não foi possível realizar o cadastro."));
            }

        } catch (erro) {
            alert("Não foi possível conectar com a API.");
            console.error(erro);
        }
    });
</script>
</body>
</html>
