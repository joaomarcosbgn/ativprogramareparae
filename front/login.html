<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Entrar — Reparaê</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined&display=block" rel="stylesheet">

  <link rel="stylesheet" href="estilos/tokens.css">
  <link rel="stylesheet" href="estilos/base.css">
  <link rel="stylesheet" href="estilos/componentes.css">
  <link rel="stylesheet" href="estilos/auth.css">
</head>
<body class="pagina-auth">

  <header class="auth-topo">
    <div class="container">
      <a href="index.html" class="marca">Repara<span>ê</span></a>
    </div>
  </header>

  <main class="auth-conteudo">
    <div class="cartao cartao-elevado auth-cartao">
      <h1>Entrar</h1>
      <p class="subtitulo">Bem-vindo(a) de volta. Acesse sua conta para continuar.</p>

      <form id="formLogin" autocomplete="on" novalidate>
        <div class="campo">
          <span class="icone">mail</span>
          <label for="email" class="rotulo-oculto">E-mail</label>
          <input type="email" id="email" name="email" placeholder="Seu e-mail" autocomplete="email" required>
        </div>
        <span class="erro-campo" id="erroEmail"></span>

        <div class="campo campo-com-acao">
          <span class="icone">lock</span>
          <label for="senha" class="rotulo-oculto">Senha</label>
          <input type="password" id="senha" name="senha" placeholder="Sua senha" autocomplete="current-password" required minlength="6">
          <button type="button" class="botao-visibilidade icone" id="botaoVerSenha" aria-label="Mostrar senha">visibility</button>
        </div>
        <span class="erro-campo" id="erroSenha"></span>

        <div class="linha-auxiliar">
          <a href="esqueci-senha.html">Esqueci minha senha</a>
        </div>

        <button type="submit" class="btn btn-primario btn-bloco" id="botaoEntrar">Entrar</button>
        <p id="mensagemLogin" class="mensagem-formulario" role="status"></p>
      </form>

      <p class="auth-rodape">
        Não tem uma conta? <a href="cadastro.html">Cadastre-se</a>
      </p>
    </div>
  </main>

  <script src="scripts/config.js"></script>
  <script src="scripts/utilitarios.js"></script>
  <script src="scripts/login.js"></script>
</body>
</html>
