<!DOCTYPE html>
<html lang="pt-br"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Administração — Reparaê</title><link rel="stylesheet" href="estilos/tokens.css"><link rel="stylesheet" href="estilos/base.css"><link rel="stylesheet" href="estilos/componentes.css">
<style>main{max-width:1050px;margin:2rem auto;padding:0 1rem}.painel{padding:1rem;border:1px solid #d8dfe8;border-radius:12px;margin:1rem 0}input,select,textarea{padding:.65rem;margin:.25rem;max-width:100%;border:1px solid #c5ced9;border-radius:6px}button{margin:.25rem;padding:.6rem;border:0;border-radius:6px;cursor:pointer}button.acao{background:#1976d2;color:white}.item{padding:.7rem;border-bottom:1px solid #ddd;display:flex;gap:.5rem;flex-wrap:wrap;align-items:center}.item span{flex:1;min-width:210px}#estado{min-height:1.5em}</style>
</head><body><main><h1>Reparaê — Administração</h1><p>Gerenciamento de usuários, categorias e serviços.</p><button id="sair">Sair</button><p id="estado" role="status"></p>
<section class="painel"><h2>Usuários</h2><p>Cadastre clientes e profissionais pelo formulário público. Aqui você pode consultar, editar e excluir contas.</p><form id="novoUsuario"><input name="nome" placeholder="Nome completo" minlength="2" required><input name="email" type="email" placeholder="E-mail" required><input name="senha" type="password" minlength="8" placeholder="Senha inicial" required><select name="tipo"><option value="cliente">Cliente</option><option value="profissional">Profissional</option></select><input name="especialidade" placeholder="Especialidade (profissional)"><input name="telefone" placeholder="Telefone com 11 dígitos (profissional)"><button class="acao">Cadastrar usuário</button></form><div id="usuarios"></div></section>
<section class="painel"><h2>Categorias</h2><form id="novaCategoria"><input name="nome" placeholder="Nome da categoria" minlength="2" required><button class="acao">Adicionar categoria</button></form><div id="categorias"></div></section>
<section class="painel"><h2>Serviços</h2><form id="novoServico"><input name="nome" placeholder="Nome do serviço" minlength="2" required><input name="preco" type="number" min="0" step="0.01" placeholder="Preço" required><select name="categoria_id" id="categoriaServico" required></select><input name="descricao" placeholder="Descrição (opcional)"><button class="acao">Adicionar serviço</button></form><div id="servicos"></div></section>
<p><a href="busca.html">Ver pesquisa pública de profissionais</a></p></main>
<script src="scripts/config.js"></script><script src="scripts/admin.js"></script></body></html>
