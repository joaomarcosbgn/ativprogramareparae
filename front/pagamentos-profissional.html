<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pagamentos — Reparaê</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined&display=block" rel="stylesheet">

  <link rel="stylesheet" href="estilos/tokens.css">

<body class="corpo-app" data-tipo-usuario="profissional" data-pagina="pagamentos">

    <section class="cabecalho-pagina">
      <div class="container">

          <button type="button" class="aba ativa" data-filtro="todos">Todos</button>
          <button type="button" class="aba" data-filtro="pendente">Pendentes</button>
          <button type="button" class="aba" data-filtro="pago" id="abaPagos">Pagos</button>
          <button type="button" class="aba" data-filtro="cancelado">Cancelados</button>
        </div>

        <div id="listaPagamentos"></div>
      </div>
    </section>
  </main>

  <nav class="nav-inferior" id="navInferior"></nav>
