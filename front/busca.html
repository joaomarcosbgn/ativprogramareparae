<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Buscar — Reparaê</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined&display=block" rel="stylesheet">

  <link rel="stylesheet" href="estilos/tokens.css">
  <link rel="stylesheet" href="estilos/base.css">
  <link rel="stylesheet" href="estilos/componentes.css">
  <link rel="stylesheet" href="estilos/app.css">
</head>
<body class="corpo-app" data-tipo-usuario="cliente" data-pagina="buscar">

  <header class="topo-app" id="navTopo"></header>

  <main>
    <section class="cabecalho-pagina">
      <div class="container">
        <h1>Buscar profissionais</h1>

        <form id="formBuscaResultados" class="busca-grande" style="margin-top: var(--espaco-4);">
          <label for="campoBuscaResultados" class="rotulo-oculto">Buscar</label>
          <div class="campo">
            <span class="icone">search</span>
            <input type="text" id="campoBuscaResultados" placeholder="O que você precisa?">
          </div>
          <button type="submit" class="btn btn-primario">Buscar</button>
        </form>

        <div class="chips-categorias" id="chipsCategorias" aria-label="Categorias"></div>
        <div class="filtro-oculto">
          <label for="filtroCategoria">Especialidade</label>
          <select id="filtroCategoria"></select>
        </div>
        <div class="filtros-busca" aria-label="Filtros e ordenação">
          <label for="filtroRegiao">Região
            <input id="filtroRegiao" type="search" placeholder="Ex.: Fortaleza" autocomplete="off">
          </label>
          <label for="ordenarProfissionais">Ordenar por
            <select id="ordenarProfissionais">
              <option value="nome_asc">Nome (A–Z)</option>
              <option value="nome_desc">Nome (Z–A)</option>
              <option value="especialidade_asc">Especialidade (A–Z)</option>
              <option value="especialidade_desc">Especialidade (Z–A)</option>
            </select>
          </label>
          <button type="button" class="btn btn-secundario" id="limparFiltros">Limpar filtros</button>
        </div>
      </div>
    </section>

    <section class="secao-app">
      <div class="container">
        <p id="resumoBusca" role="status" aria-live="polite">Carregando profissionais cadastrados...</p>
        <div class="grade-cards" id="resultadosBusca"></div>
        <nav id="paginacaoBusca" class="paginacao-busca" aria-label="Páginas de profissionais" hidden></nav>
      </div>
    </section>
  </main>

  <nav class="nav-inferior" id="navInferior"></nav>

  <script src="scripts/config.js"></script>
  <script src="scripts/utilitarios.js"></script>
  <script src="scripts/dados.js"></script>
  <script src="scripts/navegacao.js"></script>
  <script src="scripts/app.js"></script>

  <script>
(function(){if(!window.chatbase||window.chatbase("getState")!=="initialized"){window.chatbase=(...arguments)=>{if(!window.chatbase.q){window.chatbase.q=[]}window.chatbase.q.push(arguments)};window.chatbase=new Proxy(window.chatbase,{get(target,prop){if(prop==="q"){return target.q}return(...args)=>target(prop,...args)}})}const onLoad=function(){const script=document.createElement("script");script.src="https://www.chatbase.co/embed.min.js";script.id="vCGN4vdP-B0rCK6KuCEmW";script.domain="www.chatbase.co";document.body.appendChild(script)};if(document.readyState==="complete"){onLoad()}else{window.addEventListener("load",onLoad)}})();
  </script>
</body>
</html>
