<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tela-Login</title>
    <link rel="stylesheet" href="estilos/style.css">
    <link rel="stylesheet" href="estilos/media-query.css">
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined" rel="stylesheet" />
</head>
<body>
    <main>
        <section id="login">
            <div id="imagem"></div>

            <div id="formulario">
                <h1>Login</h1> 
                <p>Seja bem-vindo(a) novamente. Faça login para acessar sua conta e poder fazer as configurações no seu ambiente.</p>

                <!-- Formulário sem action="login.php" e com ID configurado -->
                <form id="form-login" autocomplete="on"> 
                    <div class="campo"> 
                        <span class="material-symbols-outlined">person</span>
                        <input type="email" name="login" id="email" placeholder="Seu e-mail" autocomplete="email" required>
                        <label for="email">Login</label> 
                    </div>

                    <div class="campo">
                        <span class="material-symbols-outlined">key</span>
                        <input type="password" name="senha" id="senha" placeholder="Sua senha" autocomplete="current-password" required minlength="6">
                        <label for="senha">Senha</label>
                    </div>

                    <input type="submit" value="Entrar">

                    <a href="esqueci.html" class="botao">
                        Esqueci a senha <span class="material-symbols-outlined">mail</span> 
                    </a>
                        
                    <p class="cadastro">
                        Não tem uma conta? <a href="cadastro.html">Cadastre-se</a>
                    </p> 

                    <!-- Parágrafo para exibir avisos ao usuário -->
                    <p id="mensagem-resposta" style="margin-top: 15px; font-weight: bold; text-align: center;"></p>
                </form>
            </div>
        </section>
    </main> 

    <!-- Script para integração com a API -->
    <script>
        const formLogin = document.getElementById('form-login');
        const mensagemResposta = document.getElementById('mensagem-resposta');
        const API_URL = 'https://ativprogramareparae.onrender.com';

        formLogin.addEventListener('submit', async (event) => {
            event.preventDefault(); // Impede o envio tradicional e recarregamento da página

            const emailDigitado = document.getElementById('email').value;
            const senhaDigitada = document.getElementById('senha').value;

            mensagemResposta.textContent = 'Aguarde, autenticando...';
            mensagemResposta.style.color = '#333';

            try {
                const response = await fetch(`${API_URL}/login`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        email: emailDigitado,
                        senha: senhaDigitada
                    })
                });

                const data = await response.json();

                if (response.ok) {
                    mensagemResposta.textContent = 'Login realizado com sucesso!';
                    mensagemResposta.style.color = 'green';
                } else {
                    mensagemResposta.textContent = data.detail || 'E-mail ou senha incorretos.';
                    mensagemResposta.style.color = 'red';
                }
            } catch (error) {
                console.error('Erro na requisição:', error);
                mensagemResposta.textContent = 'Erro ao conectar com o servidor.';
                mensagemResposta.style.color = 'red';
            }
        });
    </script>
</body>
</html>
